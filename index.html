<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Interactive Particles Wallpaper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0b0f19; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  let particles = [];
  const mouse = { x: null, y: null, radius: 140 };

  window.addEventListener('mousemove', e => { mouse.x = e.x; mouse.y = e.y; });
  window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });
  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    init();
  });

  class Particle {
    constructor(x, y, dx, dy, size) {
      this.x = x; this.y = y;
      this.dx = dx; this.dy = dy;
      this.size = size;
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = '#38bdf8';
      ctx.fill();
    }
    update() {
      if (this.x > canvas.width || this.x < 0) this.dx = -this.dx;
      if (this.y > canvas.height || this.y < 0) this.dy = -this.dy;

      if (mouse.x !== null) {
        let distX = mouse.x - this.x;
        let distY = mouse.y - this.y;
        let distance = Math.hypot(distX, distY);
        if (distance < mouse.radius) {
          this.x -= distX / 20;
          this.y -= distY / 20;
        }
      }
      this.x += this.dx;
      this.y += this.dy;
      this.draw();
    }
  }

  function init() {
    particles = [];
    let count = (canvas.width * canvas.height) / 9000;
    for (let i = 0; i < count; i++) {
      let size = Math.random() * 2 + 1;
      let x = Math.random() * canvas.width;
      let y = Math.random() * canvas.height;
      let dx = (Math.random() - 0.5) * 1.2;
      let dy = (Math.random() - 0.5) * 1.2;
      particles.push(new Particle(x, y, dx, dy, size));
    }
  }

  function connect() {
    for (let a = 0; a < particles.length; a++) {
      for (let b = a; b < particles.length; b++) {
        let dist = Math.hypot(particles[a].x - particles[b].x, particles[a].y - particles[b].y);
        if (dist < 110) {
          ctx.strokeStyle = `rgba(56, 189, 248, ${1 - dist / 110})`;
          ctx.lineWidth = 0.8;
          ctx.beginPath();
          ctx.moveTo(particles[a].x, particles[a].y);
          ctx.lineTo(particles[b].x, particles[b].y);
          ctx.stroke();
        }
      }
    }
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => p.update());
    connect();
    requestAnimationFrame(animate);
  }

  init();
  animate();
</script>
</body>
</html>
